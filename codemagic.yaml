workflows:
  ios-appetize:
    name: Build iOS App for Appetize
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      flutter: stable
      xcode: latest

  # GitHub notifies Codemagic using a webhook (an automated HTTP callback that sends real-time data from one application to another the moment a specific event occurs) that triggers the workflow
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true

    scripts:
      - name: Get Flutter packages
        script: flutter pub get

      - name: Build iOS Simulator app
        script: flutter build ios --simulator --debug

    artifacts:
      - build/ios/iphonesimulator/*.app